<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TakaGo | Login</title>

    <link rel="shortcut icon" href="./assets/favicon.avif" type="image/x-icon">

    <!-- DaisyUI -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css">

    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
        integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">

    <link rel="shortcut icon" href="./assets/T.avif" type="image/x-icon">



    <style>
        * {
            font-family: "Outfit", sans-serif;
        }
    </style>

</head>

<body class="min-h-screen max-w-md bg-base-200 mx-auto">




    <section class="w-11/12 max-w-md mx-auto min-h-screen flex flex-col justify-center py-12">
        <div class="text-center mb-10">
            <div class="inline-flex items-center gap-3">
                <div
                    class="w-11 h-11 bg-primary rounded-xl flex items-center justify-center text-white font-bold text-2xl shadow-md hover:shadow-primary/40 hover:scale-105 transition-all duration-300">
                    T
                </div>
                <h1 class="text-[2.25rem] font-bold tracking-[-2px] text-neutral">
                    Taka<span class="text-primary">Go</span>
                </h1>
            </div>
            <p class="text-xs text-base-content/40 mt-3">Simple. Secure. Smarter banking.</p>
        </div>

        <div
            class="card bg-base-100 w-full shadow-md border border-base-200 rounded-3xl hover:border-primary/30 hover:shadow-primary/10 transition-all duration-300">
            <div class="card-body p-5">
                <h2 class="text-2xl font-semibold text-center mb-8 text-neutral">Login</h2>

                <fieldset class="fieldset">
                    <label class="label font-medium text-neutral">Mobile Number</label>
                    <input id="login-number" maxlength="11" type="tel" inputmode="numeric"
                        class="input input-bordered rounded-full w-full bg-base-200 border-base-300 focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary/20 transition-all duration-300"
                        placeholder="01XXXXXXXXX">

                    <label class="label font-medium text-neutral mt-6">4 Digit PIN</label>
                    <input id="login-pin" maxlength="4" type="password" inputmode="numeric"
                        class="input input-bordered rounded-full w-full bg-base-200 border-base-300 focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary/20 transition-all duration-300"
                        placeholder="4 Digit PIN">

                    <button id="login-btn" type="button"
                        class="btn btn-primary mt-8 w-full rounded-full h-12 min-h-12 text-base font-semibold hover:shadow-lg hover:shadow-primary/30 hover:-translate-y-0.5 active:scale-[0.98] transition-all duration-300">
                        Login
                    </button>
                </fieldset>

                <div class="text-center mt-6">
                    <a href="#"
                        class="link link-primary text-sm hover:text-primary-focus transition-colors duration-300">
                        Forgot PIN?
                    </a>
                </div>
            </div>
        </div>

        <p class="text-center text-[10px] text-base-content/40 mt-6">
            <i class="fa-solid fa-shield-halved text-primary mr-1"></i>
            Your information is securely protected
        </p>
    </section>







    <script src="script/machine.js"></script>
    <script src="script/login.js"></script>

</body>

</html>
