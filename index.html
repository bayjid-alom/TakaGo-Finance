<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TakaGo | Login</title>

    <link rel="shortcut icon" href="./assets/favicon.avif" type="image/x-icon">

    <!-- DaisyUI -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css">

    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
        integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">


    <link rel="shortcut icon" href="./assets/T_favicon.avif" type="image/x-icon">
    <link rel="stylesheet" href="./styles/style.css">
</head>

<body>

    <!-- MOBILE APP BODY -->

    <main class="app-body w-full max-w-md mx-auto">

        <!-- CONTENT WIDTH -->

        <section class="w-11/12 mx-auto min-h-screen flex flex-col">

            <!-- LOGO -->

            <header class="pt-14">

                <div class="flex items-center justify-center gap-3">

                    <!-- T -->

                    <div
                        class="logo-box w-11 h-11 rounded-xl bg-primary flex items-center justify-center text-white text-2xl font-bold">
                        T
                    </div>

                    <!-- TakaGo -->

                    <h1 class="logo-text text-neutral">
                        Taka<span class="text-primary">Go</span>
                    </h1>

                </div>

                <p class="text-center text-xs text-base-content/40 mt-3">
                    Simple. Secure. Smarter banking.
                </p>

            </header>


            <!-- LOGIN AREA -->

            <div class="flex-1 flex flex-col justify-center py-10">

                <!-- LOGIN CARD -->

                <div class="login-card card w-full bg-base-100 border border-base-200 rounded-3xl shadow-lg">

                    <div class="card-body p-5">

                        <!-- Heading -->

                        <div class="text-center mb-7">

                            <h2 class="text-2xl font-semibold text-neutral">
                                Welcome back
                            </h2>

                            <p class="text-sm text-base-content/45 mt-2">
                                Login to continue to your account
                            </p>

                        </div>


                        <!-- FORM -->

                        <fieldset class="fieldset">

                            <!-- Mobile -->

                            <label class="label font-medium text-neutral">
                                Mobile Number
                            </label>

                            <input id="input-number" type="tel" inputmode="numeric" maxlength="11"
                                placeholder="01XXXXXXXXX" value="01648771835"
                                class="input input-bordered rounded-full w-full bg-base-200 focus:border-primary focus:outline-none">


                            <!-- PIN -->

                            <label class="label font-medium text-neutral mt-5">
                                4 Digit PIN
                            </label>

                            <input id="input-pin" type="password" inputmode="numeric" maxlength="4"
                                placeholder="Enter 4 digit PIN"
                                class="input input-bordered rounded-full w-full bg-base-200 focus:border-primary focus:outline-none">


                            <!-- Forgot -->

                            <div class="text-right mt-2">

                                <a href="#" class="text-xs text-primary font-medium hover:underline">
                                    Forgot PIN?
                                </a>

                            </div>


                            <!-- Login -->

                            <button id="login-btn" type="button"
                                class="login-btn btn btn-primary mt-5 w-full rounded-full h-12 min-h-12 text-base font-semibold">
                                Login
                            </button>

                        </fieldset>


                        <!-- CREATE ACCOUNT -->

                        <div class="text-center mt-6 pt-5 border-t border-base-200">

                            <p class="text-xs text-base-content/45">
                                Don't have a TakaGo account?
                            </p>

                            <a href="#" class="inline-block mt-1 text-sm font-semibold text-primary hover:underline">
                                Create an account
                            </a>

                        </div>

                    </div>

                </div>


                <!-- SECURITY -->

                <div class="flex items-center justify-center gap-2 mt-6">

                    <span
                        class="w-5 h-5 rounded-full bg-primary/10 text-primary flex items-center justify-center text-[10px] font-bold">
                        ✓
                    </span>

                    <span class="text-[10px] text-base-content/40">
                        Your information is securely protected
                    </span>

                </div>

            </div>


            <!-- FOOTER -->

            <footer class="pb-6 text-center">

                <p class="text-[9px] uppercase tracking-[1.5px] text-base-content/25 font-semibold">
                    TakaGo Financial Services
                </p>

            </footer>

        </section>

    </main>


    <script src="script/login.js"></script>

</body>

</html>
